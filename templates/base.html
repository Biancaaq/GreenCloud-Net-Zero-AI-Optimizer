<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Green Cloud Optimizare{% endblock %}</title>

    <!-- Bootstrap 5 CSS via CDN pentru viteză -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Aici vei putea adăuga fișierul tău custom.css mai târziu -->
    {% load static %}
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Taskbar / Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="#">🌱 GreenCloud</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Hartă Interactivă</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Retrofitting</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Zona de Conținut Dinamic -->
    <!-- Clasa flex-grow-1 împinge footer-ul mereu jos, chiar dacă pagina e goală -->
    <main class="container my-5 flex-grow-1">
        {% block content %}
        <!-- Tot ce scriu colegii tăi în alte pagini HTML va apărea MAGIC aici -->
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <p class="mb-0 text-secondary">© 2026 Misiunea Net Zero - Hackathon Project</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Block pentru scripturi suplimentare (ex: Chart.js sau logica pentru hartă) -->
    {% block scripts %}
    {% endblock %}
</body>
</html>
